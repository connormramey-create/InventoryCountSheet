<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Enterprise Inventory Count & Approval Manager</title>
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <!-- Stylesheet -->
    <link rel="stylesheet" href="css/styles.css?v=3">
</head>
<body>

<div class="container">
    <h1>📦 Enterprise Inventory Manager</h1>

    <!-- Action & Import Header -->
    <div class="card">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
            <label style="margin: 0;">System Actions</label>
            <span id="syncStatus" class="sync-badge sync-local">Mode: Local Storage</span>
        </div>
        <div style="display: flex; gap: 8px; flex-wrap: wrap;">
            <button class="btn btn-outline" style="flex: 1;" onclick="promptProtectedAction('upload')">📥 Import CSV File</button>
            <button class="btn btn-danger" onclick="promptProtectedAction('clear')">🗑️ Clear All Data</button>
        </div>
        <input type="file" id="csvFileInput" accept=".csv" style="display: none;" onchange="handleFileSelect(event)">
    </div>

    <!-- Filters & Sorting Section -->
    <div class="card" id="filterCard" style="display: none;">
        <div class="filter-grid">
            <div>
                <label for="entityFilter">Entity / Brand 🔒</label>
                <select id="entityFilter" onchange="onEntityFilterChange()">
                    <option value="">Select Entity...</option>
                </select>
            </div>
            <div>
                <label for="warehouseFilter">Warehouse ID / Name</label>
                <select id="warehouseFilter" onchange="applyFilters()">
                    <option value="">All Warehouses</option>
                </select>
            </div>
            <div>
                <label for="productLineFilter">Product Line</label>
                <select id="productLineFilter" onchange="applyFilters()">
                    <option value="">All Product Lines</option>
                </select>
            </div>
            <div>
                <label for="sortBySelect">Sort Items By</label>
                <select id="sortBySelect" onchange="applyFilters()">
                    <option value="name">Item Name / Description</option>
                    <option value="productLine">Product Line</option>
                    <option value="count">Count (Ascending)</option>
                    <option value="countDesc">Count (Descending)</option>
                </select>
            </div>
            <div style="grid-column: 1 / -1;">
                <label for="searchInput">Search SKU or Description</label>
                <input type="text" id="searchInput" placeholder="Search SKU, name, or attributes..." oninput="applyFilters()">
            </div>
        </div>
    </div>

    <!-- Prompt Banner when no Entity is selected -->
    <div class="card" id="entityPromptBanner" style="display: none; text-align: center; padding: 20px;">
        <p style="margin: 0; font-size: 15px; color: var(--subtext-color); font-weight: 500;">
            🔒 Select an Entity from the dropdown above to unlock and view the count sheet.
        </p>
    </div>

    <!-- Inventory Count & Workflow View -->
    <div class="card" id="dataCard" style="display: none;">
        <!-- Entity Status & Manager Controls -->
        <div class="status-header">
            <div>
                <span style="font-size: 13px; color: var(--subtext-color);">Entity Status:</span>
                <span id="entityStatusBadge" class="status-badge status-draft">DRAFT</span>
            </div>
            <div style="display: flex; gap: 6px;" id="workflowActionButtons"></div>
        </div>

        <div class="stats-bar">
            <span id="recordCount">Total Items: 0</span>
            <span id="countedCount">Items Counted: 0</span>
        </div>

        <div style="margin-bottom: 10px;">
            <button class="btn btn-secondary" style="width: 100%;" onclick="exportToCSV()">💾 Export Updated CSV</button>
        </div>

        <!-- Desktop View (Table Format) -->
        <div class="desktop-table-container table-wrapper">
            <table>
                <thead>
                    <tr id="tableHeader"></tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>

        <!-- Mobile View (Card Format) -->
        <div class="mobile-card-container" id="mobileCardList"></div>
    </div>
</div>

<!-- Password Verification Modal -->
<div class="modal-overlay" id="passwordModal">
    <div class="modal-box">
        <h3 id="modalTitle" style="margin-top:0;">Password Required</h3>
        <p id="modalDescription" style="font-size: 13px; color: var(--subtext-color);">Enter security password to proceed.</p>
        <input type="password" id="modalPasswordInput" placeholder="Enter PIN / Password">
        <div style="display: flex; gap: 8px; margin-top: 16px;">
            <button class="btn btn-outline" style="flex:1;" onclick="closeModal()">Cancel</button>
            <button class="btn" style="flex:1;" onclick="submitModalPassword()">Confirm</button>
        </div>
    </div>
</div>

<!-- JavaScript Modules (Cache Busted) -->
<script src="js/config.js?v=3"></script>
<script src="js/auth.js?v=3"></script>
<script src="js/data.js?v=3"></script>
<script src="js/app.js?v=3"></script>

</body>
</html>
